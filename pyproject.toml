[project]
name = "A-Maze-ing"
version = "0.1.0"
description = "A maze generator"
authors = [
    {name = "Gildas, Bruno"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy (<2.4)",
    "pydantic (>=2.12.5,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
